<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wall2)"/>
  <!-- Hallway Floor with perspective -->
  <polygon points="0,260 600,260 600,400 0,400" fill="url(#floor2)"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#64748b" stroke-width="3"/>
  <!-- Doorway in background -->
  <rect x="250" y="100" width="100" height="160" fill="#334155" stroke="#1e293b" stroke-width="4"/>
  <circle cx="265" cy="180" r="4" fill="#fbbf24"/>
  <!-- Reading material display rack / stand -->
  <rect x="80" y="120" width="130" height="170" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
  <!-- Shelves with brochures/pamphlets -->
  <rect x="92" y="135" width="106" height="30" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="100" y1="145" x2="150" y2="145" stroke="#0369a1" stroke-width="2"/>
  <line x1="100" y1="153" x2="185" y2="153" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="175" width="106" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="100" y1="185" x2="160" y2="185" stroke="#b45309" stroke-width="2"/>
  <line x1="100" y1="193" x2="185" y2="193" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="215" width="106" height="30" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="100" y1="225" x2="155" y2="225" stroke="#15803d" stroke-width="2"/>
  <line x1="100" y1="233" x2="185" y2="233" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Rack stand legs -->
  <line x1="110" y1="290" x2="105" y2="330" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="290" x2="185" y2="330" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <!-- Right wall notice board -->
  <rect x="420" y="110" width="140" height="90" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="440" y="145" fill="#854d0e" font-family="sans-serif" font-size="12" font-weight="700">READING MATERIAL</text>
  <text x="445" y="165" fill="#a16207" font-family="sans-serif" font-size="10">ON DISPLAY</text>
  <!-- Watermark -->
  <rect x="15" y="15" width="260" height="32" rx="6" fill="rgba(15,23,42,0.75)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">TOEIC PART 1 · PHOTO #2</text>
</svg>
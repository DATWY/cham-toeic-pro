<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfdbfe"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="pave1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky1)"/>
  <!-- Buildings background -->
  <rect x="40" y="80" width="100" height="220" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="160" y="40" width="130" height="260" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="310" y="90" width="120" height="210" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="450" y="60" width="110" height="240" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- Sidewalk -->
  <polygon points="0,300 600,300 600,400 0,400" fill="url(#pave1)"/>
  <!-- Decorative fence in back -->
  <line x1="20" y1="290" x2="580" y2="290" stroke="#475569" stroke-width="3"/>
  <line x1="60" y1="270" x2="60" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="270" x2="120" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="270" x2="180" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="240" y1="270" x2="240" y2="300" stroke="#475569" stroke-width="2"/>
  <!-- People walking carrying shopping bags -->
  <!-- Person 1 -->
  <circle cx="210" cy="200" r="16" fill="#f87171"/>
  <rect x="198" y="218" width="24" height="50" rx="4" fill="#3b82f6"/>
  <line x1="204" y1="268" x2="198" y2="330" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="216" y1="268" x2="222" y2="330" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Shopping bag 1 -->
  <path d="M 230,240 Q 235,230 240,240 L 246,275 L 224,275 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <path d="M 232,240 Q 235,232 238,240" fill="none" stroke="#78350f" stroke-width="2"/>
  <!-- Person 2 -->
  <circle cx="340" cy="190" r="16" fill="#fbbf24"/>
  <rect x="328" y="208" width="24" height="52" rx="4" fill="#10b981"/>
  <line x1="334" y1="260" x2="328" y2="325" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="346" y1="260" x2="352" y2="325" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <!-- Shopping bag 2 -->
  <path d="M 314,235 L 324,270 L 304,270 Z" fill="#ec4899" stroke="#be185d" stroke-width="2"/>
  <!-- Title watermark -->
  <rect x="15" y="15" width="260" height="32" rx="6" fill="rgba(15,23,42,0.75)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">TOEIC PART 1 · PHOTO #1</text>
</svg>
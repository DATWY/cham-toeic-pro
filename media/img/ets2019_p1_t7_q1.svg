<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="officeWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#92400e"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#officeWall)"/>
  <!-- Office window in background -->
  <rect x="360" y="40" width="180" height="150" fill="#e0f2fe" stroke="#94a3b8" stroke-width="3"/>
  <line x1="450" y1="40" x2="450" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="115" x2="540" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <!-- Office Desk -->
  <polygon points="40,240 560,240 520,380 0,380" fill="url(#deskWood)"/>
  <rect x="0" y="375" width="530" height="25" fill="#78350f"/>
  <!-- Desk laptop in background -->
  <rect x="340" y="190" width="110" height="70" rx="3" fill="#334155"/>
  <rect x="348" y="196" width="94" height="56" rx="2" fill="#38bdf8"/>
  <polygon points="325,260 465,260 480,270 310,270" fill="#64748b"/>
  <!-- Distractor Coffee mug on desk -->
  <rect x="100" y="220" width="30" height="38" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <path d="M 130,230 Q 142,238 130,248" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 108,212 Q 115,202 110,195" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Man seated at desk talking on phone -->
  <!-- Chair back -->
  <rect x="180" y="140" width="100" height="130" rx="12" fill="#1e293b"/>
  <!-- Head -->
  <circle cx="230" cy="120" r="26" fill="#fbcfe8"/>
  <path d="M 210,110 Q 230,90 250,110" fill="#374151"/>
  <!-- Torso (business shirt) -->
  <path d="M 195,146 L 265,146 L 275,250 L 185,250 Z" fill="#2563eb"/>
  <polygon points="225,146 235,146 238,210 222,210" fill="#ef4444"/>
  <!-- Left arm resting on desk -->
  <path d="M 195,155 L 160,210 L 220,245" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm holding phone to right ear -->
  <path d="M 265,155 L 285,175 L 255,130" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smartphone held to ear -->
  <rect x="250" y="112" width="12" height="24" rx="2" fill="#0f172a" transform="rotate(-15 250 112)"/>
  <!-- Speaking indication wave -->
  <path d="M 220,135 Q 212,138 215,142" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Watermark -->
  <rect x="15" y="15" width="280" height="32" rx="6" fill="rgba(15,23,42,0.8)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ETS 2019 T7 · PART 1 PHOTO #1</text>
</svg>
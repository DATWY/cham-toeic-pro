<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="workshopWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="concreteFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#workshopWall)"/>
  <!-- Floor -->
  <polygon points="0,270 600,270 600,400 0,400" fill="url(#concreteFloor)"/>
  <!-- Storage cabinet / shelves in background -->
  <rect x="40" y="80" width="140" height="190" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <line x1="40" y1="140" x2="180" y2="140" stroke="#64748b" stroke-width="2"/>
  <line x1="40" y1="200" x2="180" y2="200" stroke="#64748b" stroke-width="2"/>
  <!-- Distractor broom leaning against wall -->
  <line x1="200" y1="120" x2="175" y2="270" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="160,265 190,265 180,285 170,285" fill="#f59e0b"/>
  <!-- Man standing near wall/cabinet -->
  <circle cx="440" cy="130" r="20" fill="#fcd34d"/>
  <rect x="424" y="150" width="32" height="75" rx="3" fill="#16a34a"/>
  <line x1="432" y1="225" x2="426" y2="330" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <line x1="448" y1="225" x2="454" y2="330" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
  <!-- Woman trying on safety helmet / hard hat -->
  <circle cx="280" cy="140" r="20" fill="#fed7aa"/>
  <rect x="264" y="160" width="32" height="75" rx="3" fill="#f43f5e"/>
  <line x1="272" y1="235" x2="266" y2="340" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <line x1="288" y1="235" x2="294" y2="340" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <!-- Yellow safety helmet held by both hands above head -->
  <!-- Left hand & arm raised -->
  <path d="M 264,175 L 246,140 L 268,115" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <!-- Right hand & arm raised -->
  <path d="M 296,175 L 314,140 L 292,115" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <!-- Hard hat hovering right above head as she tries it on -->
  <path d="M 260,118 Q 280,95 300,118 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <rect x="256" y="116" width="48" height="6" rx="2" fill="#ca8a04"/>
  <!-- Watermark -->
  <rect x="15" y="15" width="280" height="32" rx="6" fill="rgba(15,23,42,0.8)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ETS 2019 T7 · PART 1 PHOTO #3</text>
</svg>
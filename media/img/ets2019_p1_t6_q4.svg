<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#f1f5f9"/>
  <!-- Meeting room floor -->
  <rect x="0" y="280" width="600" height="120" fill="#475569"/>
  <!-- Presentation Screen on Wall -->
  <rect x="160" y="40" width="280" height="160" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>
  <rect x="175" y="55" width="250" height="130" fill="#0284c7"/>
  <!-- Bar chart graphics on screen -->
  <rect x="200" y="130" width="24" height="45" fill="#facc15"/>
  <rect x="240" y="100" width="24" height="75" fill="#38bdf8"/>
  <rect x="280" y="80" width="24" height="95" fill="#4ade80"/>
  <rect x="320" y="110" width="24" height="65" fill="#f43f5e"/>
  <text x="235" y="75" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Q3 GROWTH</text>
  <!-- People looking up at the screen (back of heads) -->
  <circle cx="150" cy="270" r="22" fill="#334155"/>
  <rect x="125" y="292" width="50" height="70" rx="8" fill="#4f46e5"/>
  <circle cx="270" cy="265" r="22" fill="#1e293b"/>
  <rect x="245" y="287" width="50" height="75" rx="8" fill="#059669"/>
  <circle cx="390" cy="268" r="22" fill="#475569"/>
  <rect x="365" y="290" width="50" height="72" rx="8" fill="#ea580c"/>
  <circle cx="490" cy="272" r="20" fill="#1e293b"/>
  <rect x="470" y="292" width="40" height="68" rx="8" fill="#6b7280"/>
  <!-- Watermark -->
  <rect x="15" y="15" width="260" height="32" rx="6" fill="rgba(15,23,42,0.75)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="14">TOEIC PART 1 · PHOTO #4</text>
</svg>
    <linearGradient id="brickPath" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#9a3412"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky5)"/>
  <!-- Modern office glass facade in background -->
  <rect x="20" y="40" width="560" height="200" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>

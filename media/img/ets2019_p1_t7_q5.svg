  <rect x="155" y="240" width="35" height="26" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <path d="M 166,240 L 166,234 L 178,234 L 178,240" fill="none" stroke="#d97706" stroke-width="2"/>
  <!-- Man 2 (Right): Walking alongside colleague -->
  <circle cx="340" cy="135" r="20" fill="#fed7aa"/>

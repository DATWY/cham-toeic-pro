  <line x1="218" y1="245" x2="224" y2="340" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <!-- Right arm holding briefcase down by side -->
  <line x1="194" y1="175" x2="175" y2="240" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>

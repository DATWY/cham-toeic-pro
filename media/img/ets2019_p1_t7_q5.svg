  <line x1="520" y1="240" x2="520" y2="280" stroke="#d97706" stroke-width="1.5"/>
  <line x1="170" y1="280" x2="170" y2="320" stroke="#d97706" stroke-width="1.5"/>
  <line x1="310" y1="280" x2="310" y2="320" stroke="#d97706" stroke-width="1.5"/>
  <line x1="450" y1="280" x2="450" y2="320" stroke="#d97706" stroke-width="1.5"/>
  <!-- Man 1 (Left): Business suit holding briefcase -->
  <circle cx="210" cy="140" r="20" fill="#fde047"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="canalWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="stoneBank" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky6)"/>
  <!-- Historic European town houses with tiled roofs across the canal -->
  <rect x="30" y="80" width="110" height="120" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="20,80 85,20 150,80" fill="#b91c1c"/>
  <rect x="160" y="60" width="120" height="140" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <polygon points="150,60 220,15 290,60" fill="#991b1b"/>
  <rect x="300" y="90" width="100" height="110" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="290,90 350,35 410,90" fill="#b91c1c"/>
  <rect x="420" y="70" width="130" height="130" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="410,70 485,20 560,70" fill="#991b1b"/>
  <!-- Stone canal embankment wall -->
  <polygon points="0,200 600,200 600,280 0,280" fill="url(#canalWater)"/>
  <!-- Water ripples -->
  <line x1="40" y1="220" x2="160" y2="220" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="240" y1="235" x2="400" y2="235" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="280" y2="250" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="440" y1="260" x2="560" y2="260" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Stone walkway along canal edge in foreground -->
  <polygon points="0,280 600,280 600,400 0,400" fill="url(#stoneBank)"/>
  <!-- Stone safety railing -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#475569" stroke-width="4"/>
  <!-- Row of outdoor patio chairs placed along the canal -->
  <!-- Chair 1 -->
  <rect x="80" y="300" width="45" height="40" rx="3" fill="#1e293b"/>
  <line x1="85" y1="340" x2="82" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="340" x2="123" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="300" x2="80" y2="270" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Small Cafe Table 1 -->
  <circle cx="160" cy="330" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="352" x2="160" y2="385" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <!-- Chair 2 -->
  <rect x="210" y="300" width="45" height="40" rx="3" fill="#1e293b"/>
  <line x1="215" y1="340" x2="212" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="340" x2="253" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="300" x2="210" y2="270" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Chair 3 -->
  <rect x="360" y="300" width="45" height="40" rx="3" fill="#1e293b"/>
  <line x1="365" y1="340" x2="362" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="340" x2="403" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Small Cafe Table 2 -->
  <circle cx="440" cy="330" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="440" y1="352" x2="440" y2="385" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <!-- Chair 4 -->
  <rect x="490" y="300" width="45" height="40" rx="3" fill="#1e293b"/>
  <line x1="495" y1="340" x2="492" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="530" y1="340" x2="533" y2="375" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Watermark -->
  <rect x="15" y="15" width="280" height="32" rx="6" fill="rgba(15,23,42,0.8)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ETS 2019 T7 · PART 1 PHOTO #6</text>
</svg>
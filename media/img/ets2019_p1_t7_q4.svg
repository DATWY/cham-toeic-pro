<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kitchenTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="countertop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#kitchenTile)"/>
  <!-- Kitchen Tiles Grid -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Paper towel roll dispenser (Distractor option A) -->
  <rect x="460" y="90" width="70" height="35" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="530" cy="107" rx="6" ry="16" fill="#e2e8f0" stroke="#94a3b8"/>
  <!-- Wall appliance plug (Distractor option B) -->
  <rect x="90" y="140" width="30" height="45" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="155" x2="100" y2="165" stroke="#334155" stroke-width="2"/>
  <line x1="110" y1="155" x2="110" y2="165" stroke="#334155" stroke-width="2"/>
  <!-- Countertop -->
  <rect x="0" y="220" width="600" height="24" fill="url(#countertop)"/>
  <rect x="0" y="244" width="600" height="156" fill="#cbd5e1"/>
  <!-- Stainless steel kitchen sink -->
  <rect x="220" y="226" width="180" height="60" rx="6" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
  <rect x="235" y="234" width="150" height="45" rx="4" fill="#64748b"/>
  <!-- Water faucet -->
  <path d="M 310,224 L 310,170 Q 310,150 290,150 L 285,150" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <!-- Running water stream -->
  <line x1="285" y1="156" x2="285" y2="245" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>
  <!-- Woman washing cup in the sink -->
  <circle cx="210" cy="120" r="22" fill="#fed7aa"/>
  <path d="M 190,105 Q 210,85 230,105" fill="#78350f"/>
  <rect x="190" y="142" width="40" height="80" rx="4" fill="#8b5cf6"/>
  <!-- Arms reaching toward sink with cup -->
  <path d="M 196,160 L 245,210 L 280,230" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
  <path d="M 226,160 L 260,205 L 290,230" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
  <!-- Coffee cup under the running water -->
  <rect x="275" y="226" width="22" height="26" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <path d="M 297,232 Q 304,236 297,242" fill="none" stroke="#0284c7" stroke-width="2"/>
  <!-- Water splash bubbles -->
  <circle cx="280" cy="245" r="2" fill="#38bdf8"/>
  <circle cx="295" cy="246" r="2" fill="#38bdf8"/>
  <!-- Watermark -->
  <rect x="15" y="15" width="280" height="32" rx="6" fill="rgba(15,23,42,0.8)"/>
  <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">ETS 2019 T7 · PART 1 PHOTO #4</text>
</svg>